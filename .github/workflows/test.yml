name: Tests

'on':
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      # Force every `uv run` inside `make` to use the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run lint, type-check and tests
        run: make test

  # Verify that every dependency pinned in uv.lock can be installed from a
  # prebuilt wheel on each supported Python version. `--no-build` makes the
  # job fail instead of silently compiling a source distribution, which is
  # how a missing wheel (for example rtoml on CPython 3.15) gets caught early.
  # The final steps check the artifact users actually receive from PyPI.
  pins:
    name: Install pinned deps (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check that uv.lock is in sync with pyproject.toml
        if: matrix.python-version == '3.12'
        run: uv lock --check

      - name: Install all pinned dependencies without source builds
        run: uv sync --locked --no-build --no-install-project

      - name: Build the distributions
        run: uv build

      - name: Install the built wheel into a clean environment
        run: |
          uv venv /tmp/wheel-check --python ${{ matrix.python-version }}
          uv pip install --python /tmp/wheel-check/bin/python --no-build dist/*.whl
          /tmp/wheel-check/bin/lice --version
          uv pip check --python /tmp/wheel-check/bin/python
